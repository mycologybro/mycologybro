<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Runs</title>

<style>
body {
  font-family: Arial, sans-serif;
  background:#e7f2ff;
  padding:20px;
}

h1 { text-align:center; }

.tabs button {
  padding:8px 16px;
  margin:4px;
  cursor:pointer;
}

.tabs button.active {
  background:#333;
  color:white;
}

table {
  border-collapse: collapse;
  width:100%;
  margin-top:20px;
}

th, td {
  border:1px solid #444;
  padding:6px;
  text-align:center;
}

form {
  margin-top:20px;
  background:#fff;
  padding:15px;
  border:1px solid #aaa;
  max-width:400px;
}
</style>
</head>

<body>

<h1>Run Log</h1>

<div class="tabs" id="yearTabs"></div>

<table>
  <thead>
    <tr>
      <th>Date</th>
      <th>Distance (km)</th>
      <th>Time</th>
    </tr>
  </thead>
  <tbody id="runTable"></tbody>
</table>

<form id="runForm">
  <h3>Add Run</h3>
  <label>Date <input type="date" id="date" required></label><br><br>
  <label>Distance (km) <input type="number" step="0.01" id="distance" required></label><br><br>
  <label>Time (mm:ss) <input type="text" id="time" placeholder="14:32" required></label><br><br>
  <button type="submit">Add Run</button>
</form>

<script>
let runs = [];
let activeYear = new Date().getFullYear();

/* ---------- helpers ---------- */
function normalizeTime(t){
  if(/^\d+:\d$/.test(t)) return t.replace(/:(\d)$/, ":0$1");
  return t;
}

function assertTimeFormat(t){
  return /^\d{1,2}:\d{2}$/.test(t);
}

/* ---------- UI ---------- */
function renderTabs(){
  const years = [...new Set(runs.map(r => new Date(r.date).getFullYear()))].sort();
  const tabs = document.getElementById("yearTabs");
  tabs.innerHTML = "";

  years.forEach(y => {
    const b = document.createElement("button");
    b.textContent = y;
    if(y === activeYear) b.classList.add("active");
    b.onclick = () => setYear(y);
    tabs.appendChild(b);
  });
}

function renderTable(){
  const tbody = document.getElementById("runTable");
  tbody.innerHTML = "";

  runs
    .filter(r => new Date(r.date).getFullYear() === activeYear)
    .forEach(r => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${r.date}</td>
        <td>${r.distance}</td>
        <td>${r.time}</td>
      `;
      tbody.appendChild(tr);
    });
}

function setYear(y){
  activeYear = y;
  renderTabs();
  renderTable();
}

/* ---------- data ---------- */
async function loadRuns(){
  const res = await fetch("runs.json", { cache: "no-store" });
  runs = await res.json();
  setYear(activeYear);
}

async function saveRun(run){
  const res = await fetch("/.netlify/functions/addRun", {
    method: "POST",
    headers: { "Content-Type":"application/json" },
    body: JSON.stringify(run)
  });

  if(!res.ok){
    alert("Failed to save run to GitHub");
  }
}

/* ---------- form ---------- */
document.getElementById("runForm").addEventListener("submit", async e => {
  e.preventDefault();

  const date = document.getElementById("date").value;
  let distance = document.getElementById("distance").value;
  let time = document.getElementById("time").value.trim();

  if(!assertTimeFormat(time)){
    alert("Time must be mm:ss");
    return;
  }

  time = normalizeTime(time);
  distance = Number(distance).toFixed(2);

  const run = { date, distance, time };

  runs.push(run);
  setYear(new Date(date).getFullYear());

  await saveRun(run);

  e.target.reset();
});

/* ---------- init ---------- */
loadRuns();
</script>

</body>
</html>
