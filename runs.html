<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Run Tracker</title>

  <style>
    :root { --accent:#007acc; --bg:#f4f4f4; --card:#fff; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      margin: 0;
      padding: 20px;
      color: #111;
      text-align: center;
    }

    /* Header banner */
    .hero {
      width: 100%;
      height: 160px;
      border-radius: 10px;
      overflow: hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      margin-bottom: 12px;
      background-image: url("images/running.png");
      background-size: cover;
      background-position: center;
      position: relative;
      box-shadow: 0 6px 18px rgba(0,0,0,0.12);
    }
    .hero::after {
      /* subtle dark overlay for legible text */
      content: "";
      position:absolute; inset:0;
      background: rgba(0,0,0,0.28);
    }
    .hero h1 {
      position: relative;
      margin: 0;
      color: #fff;
      font-size: 36px;
      letter-spacing: 2px;
      z-index: 2;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.6);
    }

    /* Nav */
    nav {
      margin: 14px 0;
      display: flex;
      justify-content: center;
      gap: 12px;
    }
    nav a {
      text-decoration: none;
      color: #222;
      background: #fff;
      border: 1px solid #ddd;
      padding: 8px 12px;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
      font-weight: 600;
    }

    /* Form card */
    .card {
      max-width: 760px;
      margin: 14px auto;
      background: var(--card);
      padding: 14px;
      border-radius: 8px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.06);
      text-align: left;
    }
    form { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:center; }
    form .field { display:flex; flex-direction:column; }
    input[type="date"], input[type="number"], input[type="text"] {
      padding:8px 10px;
      border-radius:6px;
      border:1px solid #ccc;
      font-size:14px;
      width:180px;
    }
    button[type="submit"] {
      padding:10px 18px;
      background: var(--accent);
      color:white;
      border:none;
      border-radius:8px;
      cursor:pointer;
      font-weight:700;
    }

    /* Table & chart */
    table {
      width:100%;
      border-collapse: collapse;
      margin-top: 18px;
      background: #fff;
    }
    th, td {
      padding:10px;
      border:1px solid #ddd;
      text-align:center;
    }
    th { background:#6c7ae0; color:#fff; }
    tr:nth-child(even) { background:#f8fbff; }
    #runsChart { max-width:900px; height:420px; margin:26px auto; display:block; background:#fff; border-radius:8px; padding:12px; box-shadow: 0 6px 18px rgba(0,0,0,0.04); }

    @media (max-width:720px) {
      .hero { height:120px; }
      .hero h1 { font-size:26px; }
      input[type="date"], input[type="number"], input[type="text"] { width:100%; max-width:300px; }
      .card { padding:10px; }
    }
  </style>
</head>
<body>

  <div class="hero">
    <h1>RUNNING</h1>
  </div>

  <nav>
    <a href="index.html">Jars</a>
    <a href="tubs.html">Tubs</a>
    <a href="coin.html">Coin</a>
    <a href="agar.html">Agar</a>
  </nav>

  <div class="card">
    <form id="runForm" autocomplete="off">
      <div class="field">
        <label for="date">Date</label>
        <input id="date" type="date" required>
      </div>

      <div class="field">
        <label for="distance">Distance (km)</label>
        <input id="distance" type="number" step="0.01" placeholder="e.g. 5.20" required>
      </div>

      <div class="field">
        <label for="time">Time (mm:ss)</label>
        <input id="time" type="text" placeholder="14:54" required>
      </div>

      <div class="field" style="align-self:center;">
        <label style="visibility:hidden">submit</label>
        <button type="submit">Add Run</button>
      </div>
    </form>
  </div>

  <table id="runsTable" class="card" style="max-width:900px; margin:12px auto;">
    <thead>
      <tr><th>Date</th><th>Distance (km)</th><th>Time (mm:ss)</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <canvas id="runsChart"></canvas>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
  // CONFIG — edit if your Netlify or raw GitHub URL differs
  const NETLIFY_FN = "https://mycology-bro.netlify.app/.netlify/functions/addRun";
  const RAW_RUNS_JSON = "https://raw.githubusercontent.com/mycologybro/mycologybro/main/runs.json";

  // Utilities
  function assertTimeFormat(t) {
    // accepts mm:ss where mm 0-99 and ss 00-59
    return /^[0-9]{1,2}:[0-5][0-9]$/.test(t.trim());
  }
  function normalizeTime(t) {
    const m = t.split(":").map(s=>s.trim());
    if (m.length !== 2) return t;
    const mm = String(parseInt(m[0],10));
    let ss = parseInt(m[1],10);
    if (isNaN(ss)) ss = 0;
    ss = Math.max(0, Math.min(59, ss));
    return `${mm}:${String(ss).padStart(2,"0")}`;
  }
  function timeToMinutes(t) {
    const [mm, ss] = t.split(":").map(Number);
    if (isNaN(mm) || isNaN(ss)) return 0;
    return mm + ss/60;
  }

  // DOM refs
  const form = document.getElementById("runForm");
  const tableBody = document.querySelector("#runsTable tbody");
  const ctx = document.getElementById("runsChart").getContext("2d");
  let chart = null;
  let runs = []; // local array of runs loaded from GitHub

  // Render helpers
  function clearTable() {
    tableBody.innerHTML = "";
  }
  function appendTableRow(r) {
    const tr = document.createElement("tr");
    const d1 = document.createElement("td"); d1.textContent = r.date; tr.appendChild(d1);
    const d2 = document.createElement("td"); d2.textContent = Number(r.distance).toFixed(2); tr.appendChild(d2);
    const d3 = document.createElement("td"); d3.textContent = r.time; tr.appendChild(d3);
    tableBody.appendChild(tr);
  }
  function renderTable(runsArr) {
    clearTable();
    runsArr.forEach(appendTableRow);
  }

  function renderChart(runsArr) {
    const sorted = runsArr.slice().sort((a,b)=>new Date(a.date) - new Date(b.date));
    const labels = sorted.map(r=>r.date);
    const data = sorted.map(r=>timeToMinutes(r.time));
    if (chart) chart.destroy();
    chart = new Chart(ctx, {
      type: "line",
      data: {
        labels,
        datasets: [{
          label: "Time (minutes)",
          data,
          borderColor: "rgb(20,110,220)",
          backgroundColor: "rgba(20,110,220,0.15)",
          tension: 0.25,
          pointRadius: 4,
          pointHoverRadius: 6,
          fill: false
        }]
      },
      options: {
        responsive: true,
        interaction: { mode: 'index', intersect: false },
        scales: {
          x: { title: { display:true, text: "Date" } },
          y: { title: { display:true, text: "Time (minutes)" } }
        }
      }
    });
  }

  // Load runs.json from GitHub
  async function loadRunsFromGit() {
    console.log("Loading runs.json from", RAW_RUNS_JSON);
    try {
      const res = await fetch(RAW_RUNS_JSON, {cache: "no-store"});
      if (!res.ok) {
        console.warn("runs.json fetch failed:", res.status);
        runs = [];
      } else {
        const data = await res.json();
        if (!Array.isArray(data)) {
          console.warn("runs.json not an array:", data);
          runs = [];
        } else {
          runs = data.map(r => ({ date: r.date, distance: Number(r.distance).toFixed(2), time: r.time }));
        }
      }
    } catch (err) {
      console.error("Failed to load runs.json:", err);
      runs = [];
    }
    renderTable(runs);
    renderChart(runs);
  }

  // Save run via Netlify function
  async function saveRunToNetlify(run) {
    try {
      console.log("Posting to Netlify function:", NETLIFY_FN, run);
      const res = await fetch(NETLIFY_FN, {
        method: "POST",
        headers: { "Content-Type":"application/json" },
        body: JSON.stringify(run)
      });

      // Netlify function returns JSON (CORS headers are handled server-side)
      const json = await res.json().catch(()=>null);
      console.log("Netlify response", res.status, json);
      return { ok: res.ok, status: res.status, json };
    } catch (err) {
      console.error("Error posting to Netlify function:", err);
      return { ok:false, error: err.message };
    }
  }

  // Form submit
  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const date = document.getElementById("date").value;
    let distance = document.getElementById("distance").value;
    let time = document.getElementById("time").value.trim();

    // Basic validation
    if (!date) return alert("Please provide a date.");
    if (!distance || isNaN(Number(distance))) return alert("Provide a numeric distance.");
    // normalize distance
    distance = Number(distance).toFixed(2);

    // normalize/validate time
    time = normalizeTime(time);
    if (!assertTimeFormat(time)) {
      return alert("Time should be in mm:ss format, seconds 00-59 (e.g. 14:54)");
    }

    const run = { date, distance, time };

    // Optimistic UI update
    runs.push(run);
    renderTable(runs);
    renderChart(runs);

    // Save to GitHub via Netlify function
    const result = await saveRunToNetlify(run);
    if (result.ok) {
      console.log("Saved to GitHub (Netlify):", result.json);
      // reload from GitHub to show canonical data (commit might take a few seconds)
      setTimeout(loadRunsFromGit, 1200);
    } else {
      console.error("Save failed:", result);
      alert("Failed to save to GitHub. Check Netlify function logs.");
    }

    // clear form
    form.reset();
  });

  // Initialize
  (function init() {
    loadRunsFromGit();
  })();
  </script>
</body>
</html>
