<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Run Tracker</title>

<style>
:root { --accent:#007acc; --bg:#f4f4f4; --card:#fff; }

body {
  font-family: Arial, Helvetica, sans-serif;
  background: var(--bg);
  margin: 0;
  padding: 20px;
  color: #111;
  text-align: center;
}

.hero {
  width: 100%;
  height: 160px;
  border-radius: 10px;
  overflow: hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom: 12px;
  background-image: url("images/running.png");
  background-size: cover;
  background-position: center;
  position: relative;
}

.hero::after {
  content:"";
  position:absolute;
  inset:0;
  background: rgba(0,0,0,0.28);
}

.hero h1 {
  position: relative;
  color:#fff;
  font-size:36px;
  z-index:2;
}

.card {
  max-width:760px;
  margin:14px auto;
  background:#fff;
  padding:14px;
  border-radius:8px;
}

form {
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  justify-content:center;
}

.field {
  display:flex;
  flex-direction:column;
}

input {
  padding:8px;
  border-radius:6px;
  border:1px solid #ccc;
}

button {
  padding:10px 18px;
  background:var(--accent);
  color:#fff;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

table {
  width:100%;
  border-collapse:collapse;
  margin-top:18px;
}

th,td {
  border:1px solid #ddd;
  padding:10px;
}

th {
  background:#6c7ae0;
  color:#fff;
}

#runsChart {
  max-width:900px;
  height:420px;
  margin:26px auto;
}
</style>
</head>

<body>

<div class="hero"><h1>RUNNING</h1></div>

<div class="card">
<form id="runForm">
  <div class="field">
    <label>Date</label>
    <input id="date" type="date" required>
  </div>
  <div class="field">
    <label>Distance</label>
    <input id="distance" type="number" step="0.01" required>
  </div>
  <div class="field">
    <label>Time (mm:ss)</label>
    <input id="time" type="text" required>
  </div>
  <button type="submit">Add Run</button>
</form>
</div>

<table id="runsTable" class="card">
<thead>
<tr><th>Date</th><th>Distance</th><th>Time</th></tr>
</thead>
<tbody></tbody>
</table>

<canvas id="runsChart"></canvas>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
const NETLIFY_FN = "https://mycology-bro.netlify.app/.netlify/functions/addRun";
const RAW_RUNS_JSON = "https://raw.githubusercontent.com/mycologybro/mycologybro/main/runs.json";

const form = document.getElementById("runForm");
const dateInput = document.getElementById("date");
const distanceInput = document.getElementById("distance");
const timeInput = document.getElementById("time");
const tableBody = document.querySelector("#runsTable tbody");
const ctx = document.getElementById("runsChart").getContext("2d");

let runs = [];
let chart = null;

function normalizeTime(t){
  const [m,s] = t.split(":");
  return `${parseInt(m)}:${String(Math.min(59,parseInt(s)||0)).padStart(2,"0")}`;
}

function renderTable(){
  tableBody.innerHTML="";
  runs.forEach(r=>{
    const tr=document.createElement("tr");
    tr.innerHTML = `
      <td>${r.date}</td>
      <td>${Number(r.distance).toFixed(2)}</td>
      <td>${r.time}</td>`;
    tableBody.appendChild(tr);
  });
}

function renderChart(){
  if(chart) chart.destroy();
  chart = new Chart(ctx,{
    type:"line",
    data:{
      labels:runs.map(r=>r.date),
      datasets:[{
        label:"Pace",
        data:runs.map(r=>(Number(r.time.split(":")[0])+r.time.split(":")[1]/60)/r.distance),
        borderColor:"blue"
      }]
    }
  });
}

async function loadRuns(){
  try{
    const res=await fetch(RAW_RUNS_JSON,{cache:"no-store"});
    if(res.ok) runs=await res.json();
  }catch(e){}
  renderTable();
  renderChart();
}

form.addEventListener("submit",async e=>{
  e.preventDefault();
  const run={
    date:dateInput.value,
    distance:Number(distanceInput.value).toFixed(2),
    time:normalizeTime(timeInput.value)
  };
  runs.push(run);
  renderTable();
  renderChart();
  fetch(NETLIFY_FN,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(run)});
  form.reset();
});

loadRuns();
</script>

</body>
</html>
