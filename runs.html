<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Run Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #fdf6b2; /* light yellow */
    }
    header {
      text-align: center;
      margin-bottom: 20px;
    }
    header img {
      max-width: 100%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    nav {
      text-align: center;
      margin: 20px 0;
    }
    nav a {
      margin: 0 10px;
      text-decoration: none;
      color: #333;
      font-weight: bold;
    }
    form {
      margin-bottom: 20px;
      text-align: center;
    }
    form input {
      margin: 5px;
      padding: 8px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: white;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: center;
    }
    th {
      background: #4caf50;
      color: white;
    }
    tr:nth-child(even) {
      background: #f9f9f9;
    }
    .button-bar {
      text-align: center;
      margin-top: 15px;
    }
    .button-bar button {
      padding: 10px 15px;
      background: #e63946;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .button-bar button:hover {
      background: #d62828;
    }
    canvas {
      margin-top: 20px;
      background: white;
      border-radius: 8px;
      padding: 10px;
    }
  </style>
</head>
<body>

  <header>
    <img src="images/running_header.png" alt="Running Tracker">
  </header>

  <nav>
    <a href="index.html">Jars</a>
    <a href="tubs.html">Tubs</a>
    <a href="coin.html">Coins</a>
  </nav>

  <form id="runForm">
    <input type="date" id="date" required>
    <input type="number" id="distance" placeholder="Distance (km)" step="0.01" required>
    <input type="text" id="time" placeholder="Time (mm:ss)" pattern="^[0-9]{1,2}:[0-5][0-9]$" required>
    <button type="submit">Add Run</button>
  </form>

  <table id="runTable">
    <thead>
      <tr>
        <th>Date</th>
        <th>Distance (km)</th>
        <th>Time (mm:ss)</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div class="button-bar">
    <button id="clearRuns">Clear All Runs</button>
  </div>

  <canvas id="runChart" width="400" height="200"></canvas>

  <script>
    const runForm = document.getElementById('runForm');
    const runTableBody = document.querySelector('#runTable tbody');
    const ctx = document.getElementById('runChart').getContext('2d');
    const clearButton = document.getElementById('clearRuns');

    let runs = JSON.parse(localStorage.getItem('runs')) || [];
    let chart;

    // Render saved runs on page load
    runs.forEach(r => addRunToTable(r));
    updateChart();

    runForm.addEventListener('submit', function(e) {
      e.preventDefault();

      const date = document.getElementById('date').value;
      const distance = parseFloat(document.getElementById('distance').value).toFixed(2); 
      const time = document.getElementById('time').value;

      const run = { date, distance, time };

      // Save in array + localStorage
      runs.push(run);
      localStorage.setItem('runs', JSON.stringify(runs));

      // Add to table
      addRunToTable(run);

      // Update chart
      updateChart();

      // Reset form
      runForm.reset();
    });

    function addRunToTable(run) {
      const row = document.createElement('tr');
      row.innerHTML = `<td>${run.date}</td><td>${run.distance}</td><td>${run.time}</td>`;
      runTableBody.appendChild(row);
    }

    function timeToMinutes(timeStr) {
      const [min, sec] = timeStr.split(':').map(Number);
      return min + sec / 60;
    }

    function updateChart() {
      if (runs.length === 0) return;

      if (chart) chart.destroy();

      chart = new Chart(ctx, {
        type: 'scatter',
        data: {
          datasets: [{
            label: 'Runs',
            data: runs.map(r => ({ x: parseFloat(r.distance), y: timeToMinutes(r.time) })),
            backgroundColor: 'blue'
          }]
        },
        options: {
          scales: {
            x: {
              title: { display: true, text: 'Distance (km)' }
            },
            y: {
              title: { display: true, text: 'Time (minutes)' }
            }
          }
        }
      });
    }

    // Clear all runs
    clearButton.addEventListener('click', function() {
      if (confirm("Are you sure you want to clear all runs?")) {
        runs = [];
        localStorage.removeItem('runs');
        runTableBody.innerHTML = "";
        if (chart) chart.destroy();
      }
    });
  </script>

</body>
</html>
