<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Run Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    img.header {
      max-width: 600px;
      margin-bottom: 20px;
    }
    nav a {
      margin: 0 10px;
      text-decoration: none;
      color: #fff;
      background: #0077cc;
      padding: 10px 15px;
      border-radius: 5px;
    }
    table {
      width: 80%;
      margin: 20px auto;
      border-collapse: collapse;
      background: white;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: center;
    }
    th {
      background-color: #0077cc;
      color: white;
    }
    #runForm {
      margin: 20px auto;
      width: 80%;
    }
    input, button {
      margin: 5px;
      padding: 8px;
    }
  </style>
</head>
<body>

  <!-- Header Image -->
  <img src="images/running-header.png" alt="Running" class="header">

  <!-- Navigation -->
  <nav>
    <a href="index.html">Jars</a>
    <a href="tubs.html">Tubs</a>
    <a href="coin.html">Coin</a>
  </nav>

  <h1>Run Tracker</h1>

  <!-- Run Input Form -->
  <form id="runForm">
    <input type="date" id="date" required>
    <input type="number" step="0.01" id="distance" placeholder="Distance (km)" required>
    <input type="text" id="time" placeholder="Time (mm:ss)" pattern="^\\d{1,2}:\\d{2}$" required>
    <button type="submit">Add Run</button>
  </form>

  <!-- Run Table -->
  <table id="runTable">
    <thead>
      <tr>
        <th>Date</th>
        <th>Distance (km)</th>
        <th>Time (mm:ss)</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <!-- Chart -->
  <canvas id="runChart" width="400" height="200"></canvas>

  <script>
    const runForm = document.getElementById('runForm');
    const runTableBody = document.querySelector('#runTable tbody');
    const ctx = document.getElementById('runChart').getContext('2d');

    let runs = [];
    let chart;

    runForm.addEventListener('submit', function(e) {
      e.preventDefault();

      const date = document.getElementById('date').value;
      const distance = parseFloat(document.getElementById('distance').value).toFixed(2); // force 2 decimals
      const time = document.getElementById('time').value;

      // Add to array
      runs.push({ date, distance, time });

      // Add to table
      const row = document.createElement('tr');
      row.innerHTML = `<td>${date}</td><td>${distance}</td><td>${time}</td>`;
      runTableBody.appendChild(row);

      // Update chart
      updateChart();
      
      // Reset form
      runForm.reset();
    });

    function timeToMinutes(timeStr) {
      const [min, sec] = timeStr.split(':').map(Number);
      return min + sec / 60;
    }

    function updateChart() {
      const distances = runs.map(r => r.distance);
      const times = runs.map(r => timeToMinutes(r.time));

      if (chart) chart.destroy();

      chart = new Chart(ctx, {
        type: 'scatter',
        data: {
          datasets: [{
            label: 'Runs',
            data: runs.map(r => ({ x: parseFloat(r.distance), y: timeToMinutes(r.time) })),
            backgroundColor: 'blue'
          }]
        },
        options: {
          scales: {
            x: {
              title: { display: true, text: 'Distance (km)' }
            },
            y: {
              title: { display: true, text: 'Time (minutes)' }
            }
          }
        }
      });
    }
  </script>

</body>
</html>
