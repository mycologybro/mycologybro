<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Run Tracker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    h1 {
      color: #333;
    }
    table {
      margin: 20px auto;
      border-collapse: collapse;
      width: 80%;
      background-color: white;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: center;
    }
    th {
      background-color: #6c7ae0;
      color: white;
    }
    tr:nth-child(even) {
      background-color: #f9f9f9;
    }
    #runsChart {
      margin-top: 40px;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
    }
    .nav-links {
      margin-top: 20px;
    }
    .nav-links a {
      margin: 0 10px;
    }
  </style>
</head>
<body>

  <h1>🏃 Running Log</h1>

  <form id="runForm">
    <label>Date: <input type="date" id="date" required></label>
    <label>Distance (km): <input type="number" id="distance" step="0.01" required></label>
    <label>Time (mm:ss): <input type="text" id="time" pattern="^[0-9]{1,2}:[0-5][0-9]$" placeholder="14:35" required></label>
    <button type="submit">Add Run</button>
  </form>

  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Distance (km)</th>
        <th>Time (mm:ss)</th>
      </tr>
    </thead>
    <tbody id="runsTable"></tbody>
  </table>

  <canvas id="runsChart"></canvas>

    <a href="tubs.html">Tubs</a>
    <a href="coin.html">Coin</a>
  </div>
