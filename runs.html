<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Run Tracker</title>
  <style>
    body {
      background-color: #f0f8ff;
      font-family: Arial, sans-serif;
      margin: 20px;
      text-align: center;
    }
    header img {
      max-width: 100%;
      height: auto;
    }
    form {
      margin: 20px auto;
      padding: 15px;
      border: 2px solid #333;
      border-radius: 8px;
      background: #fff;
      width: 300px;
    }
    form input {
      display: block;
      margin: 10px auto;
      padding: 8px;
      width: 90%;
    }
    button {
      padding: 10px 20px;
      background: #007acc;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background: #005f99;
    }
    table {
      margin: 20px auto;
      border-collapse: collapse;
      width: 80%;
      max-width: 600px;
    }
    th, td {
      border: 1px solid #333;
      padding: 8px;
    }
    th {
      background: #eee;
    }
    canvas {
      margin-top: 30px;
      max-width: 600px;
      width: 100%;
    }
  </style>
</head>
<body>
  <header>
    <img src="images/running.png" alt="Running Tracker">
  </header>

  <nav>
    <a href="index.html">Jars</a> |
    <a href="tubs.html">Tubs</a> |
    <a href="coin.html">Coin</a> |
    <a href="agar.html">Agar</a>
  </nav>

  <h2>Track Your Runs</h2>

  <form id="runForm">
    <input type="date" id="date" required>
    <input type="number" id="distance" step="0.01" placeholder="Distance (km)" required>
    <input type="text" id="time" pattern="^[0-9]{1,2}:[0-5][0-9]$" placeholder="Time (MM:SS)" required>
    <button type="submit">Add Run</button>
  </form>

  <table id="runsTable">
    <thead>
      <tr>
        <th>Date</th>
        <th>Distance (km)</th>
        <th>Time (MM:SS)</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <canvas id="runsChart"></canvas>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    const form = document.getElementById("runForm");
    const tableBody = document.querySelector("#runsTable tbody");
    const chartCtx = document.getElementById("runsChart").getContext("2d");

    let chart;
    let runs = [];

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const date = document.getElementById("date").value;
      const distance = parseFloat(document.getElementById("distance").value).toFixed(2);
      const time = document.getElementById("time").value;

      try {
        const response = await fetch("https://mycology-bro.netlify.app/.netlify/functions/addRun", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ date, distance, time }),
        });

        const result = await response.json();
        console.log("Server response:", result);

        if (response.ok) {
          addRow({ date, distance, time });
          runs.push({ date, distance, time });
          updateChart();
          form.reset();
        } else {
          alert("Error: " + result.error);
        }
      } catch (err) {
        console.error("Request failed:", err);
        alert("Failed to add run.");
      }
    });

    function addRow(run) {
      const row = document.createElement("tr");
      row.innerHTML = `<td>${run.date}</td><td>${run.distance}</td><td>${run.time}</td>`;
      tableBody.appendChild(row);
    }

    function updateChart() {
      const labels = runs.map(r => r.date);
      const distances = runs.map(r => r.distance);
      const times = runs.map(r => {
        const [min, sec] = r.time.split(":").map(Number);
        return min * 60 + sec;
      });

      if (chart) chart.destroy();

      chart = new Chart(chartCtx, {
        type: "line",
        data: {
          labels: labels,
          datasets: [
            {
              label: "Distance (km)",
              data: distances,
              borderColor: "blue",
              fill: false,
              yAxisID: "y1",
            },
            {
              label: "Time (seconds)",
              data: times,
              borderColor: "red",
              fill: false,
              yAxisID: "y2",
            },
          ],
        },
        options: {
          scales: {
            y1: { type: "linear", position: "left", title: { display: true, text: "Distance (km)" } },
            y2: { type: "linear", position: "right", title: { display: true, text: "Time (s)" } },
          },
        },
      });
    }
  </script>
</body>
</html>
