<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Run Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
    }
    form {
      margin: 20px 0;
      text-align: center;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: #fff;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: center;
    }
    th {
      background: #6c7ae0;
      color: white;
    }
    tr:nth-child(even) {
      background: #f9f9f9;
    }
    canvas {
      margin-top: 30px;
      display: block;
      width: 100%;
      max-width: 700px;
      height: 400px;
    }
  </style>
</head>
<body>
  <h1>Run Tracker</h1>

  <form id="runForm">
    <input type="date" id="date" required>
    <input type="number" step="0.01" id="distance" placeholder="Distance (km)" required>
    <input type="text" id="time" placeholder="Time (MM:SS)" pattern="\\d{1,2}:\\d{2}" required>
    <button type="submit">Add Run</button>
  </form>

  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Distance (km)</th>
        <th>Time (MM:SS)</th>
      </tr>
    </thead>
    <tbody id="runTableBody"></tbody>
  </table>

  <canvas id="runChart"></canvas>

  <script>
    const username = "mycologybro"; // your GitHub username
    const repo = "mycologybro";    // your repository name
    const branch = "main";         // or "master" depending on repo
    const filePath = "runs.json";

    async function fetchRuns() {
      const url = `https://raw.githubusercontent.com/${username}/${repo}/${branch}/${filePath}`;
      const res = await fetch(url);
      return res.ok ? res.json() : [];
    }

    async function renderRuns() {
      const runs = await fetchRuns();
      const tbody = document.getElementById("runTableBody");
      tbody.innerHTML = "";
      runs.forEach(run => {
        const row = `<tr><td>${run.date}</td><td>${run.distance}</td><td>${run.time}</td></tr>`;
        tbody.innerHTML += row;
      });

      // Chart data
      const ctx = document.getElementById("runChart").getContext("2d");
      new Chart(ctx, {
        type: "line",
        data: {
          labels: runs.map(r => r.date),
          datasets: [{
            label: "Time (min)",
            data: runs.map(r => {
              const [m, s] = r.time.split(":").map(Number);
              return m + s / 60;
            }),
            borderColor: "blue",
            fill: false
          }]
        }
      });
    }

    document.getElementById("runForm").addEventListener("submit", async e => {
      e.preventDefault();
      const date = document.getElementById("date").value;
      const distance = parseFloat(document.getElementById("distance").value).toFixed(2);
      const time = document.getElementById("time").value;

      const payload = {
        event_type: "update-runs",
        client_payload: { date, distance, time }
      };

      await fetch(`https://api.github.com/repos/${username}/${repo}/dispatches`, {
        method: "POST",
        headers: {
          "Accept": "application/vnd.github+json",
          "Authorization": "token YOUR_PAT_HERE"
        },
        body: JSON.stringify(payload)
      });

      alert("Run submitted! It may take a minute to update.");
    });

    renderRuns();
  </script>
</body>
</html>
