<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Run Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f8ff;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    header {
      background: url("images/running-header.png") no-repeat center;
      background-size: cover;
      padding: 40px;
      color: white;
      font-size: 2em;
      font-weight: bold;
    }
    nav a {
      margin: 10px;
      text-decoration: none;
      font-weight: bold;
      color: #333;
    }
    form {
      margin: 20px auto;
      padding: 20px;
      background: #fff;
      border: 2px solid #ccc;
      border-radius: 10px;
      width: 300px;
    }
    input {
      margin: 8px 0;
      padding: 6px;
      width: 90%;
    }
    button {
      padding: 10px 20px;
      margin-top: 10px;
      border: none;
      border-radius: 5px;
      background: #007acc;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    canvas {
      margin: 30px auto;
      display: block;
      max-width: 600px;
    }
  </style>
</head>
<body>
  <header>RUNNING</header>

  <nav>
    <a href="index.html">Jars</a>
    <a href="tubs.html">Tubs</a>
    <a href="coin.html">Coins</a>
    <a href="runs.html">Running</a>
    <a href="agar.html">Agar</a>
  </nav>

  <form id="runForm">
    <label>Date: <input type="date" id="date" required></label><br>
    <label>Distance (km): <input type="number" step="0.01" id="distance" required></label><br>
   <label>Time (mm:ss):
  <input type="text" id="time" pattern="\d{1,2}:\d{2}" placeholder="mm:ss" required>
</label>
<br>
    <button type="submit">Add Run</button>
  </form>

  <canvas id="runsChart"></canvas>

  <script>
    const form = document.getElementById("runForm");
    const ctx = document.getElementById("runsChart").getContext("2d");

    let runs = [];
    let chart = new Chart(ctx, {
      type: "line",
      data: {
        labels: [],
        datasets: [{
          label: "Time (minutes)",
          data: [],
          borderColor: "blue",
          fill: false
        }]
      },
      options: {
        scales: {
          x: { title: { display: true, text: "Date" }},
          y: { title: { display: true, text: "Time (minutes)" }}
        }
      }
    });

    function updateChart() {
      chart.data.labels = runs.map(r => r.date);
      chart.data.datasets[0].data = runs.map(r => r.timeMinutes);
      chart.update();
    }

    function timeToMinutes(timeStr) {
      const [m, s] = timeStr.split(":").map(Number);
      return m + s / 60;
    }

    async function loadRuns() {
      const res = await fetch("https://raw.githubusercontent.com/mycologybro/mycology-bro/main/runs.json");
      if (!res.ok) return;
      const data = await res.json();
      runs = data.map(r => ({
        ...r,
        timeMinutes: timeToMinutes(r.time)
      }));
      updateChart();
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const date = document.getElementById("date").value;
      const distance = parseFloat(document.getElementById("distance").value).toFixed(2);
      const time = document.getElementById("time").value;

      const run = { date, distance, time };

      const res = await fetch("/.netlify/functions/addRun", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(run)
      });

      const data = await res.json();
      alert(data.message || "Run submitted! Please refresh in a moment.");

      runs.push({ ...run, timeMinutes: timeToMinutes(time) });
      updateChart();
      form.reset();
    });

    loadRuns();
  </script>
</body>
</html>
