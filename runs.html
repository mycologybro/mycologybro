<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run Tracker</title>

<style>
:root { --accent:#007acc; --bg:#f4f4f4; --card:#fff; }

body {
  font-family: Arial, Helvetica, sans-serif;
  background: var(--bg);
  margin: 0;
  padding: 20px;
  text-align: center;
}

.hero {
  height: 160px;
  border-radius: 10px;
  background-image: url("images/running.png");
  background-size: cover;
  background-position: center;
  position: relative;
  margin-bottom: 20px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.hero::after {
  content:"";
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.3);
}
.hero h1 {
  position: relative;
  color:#fff;
  font-size:36px;
  letter-spacing:2px;
}

.card {
  max-width: 900px;
  margin: 16px auto;
  background: var(--card);
  padding: 16px;
  border-radius: 8px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.06);
}

.tabs {
  margin: 20px 0;
}
.tabs button {
  padding:10px 20px;
  font-size:16px;
  cursor:pointer;
}
.tabs .active {
  background:#6c7ae0;
  color:white;
}

form {
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  justify-content:center;
}
.field {
  display:flex;
  flex-direction:column;
}
input {
  padding:8px;
  border-radius:6px;
  border:1px solid #ccc;
}
button[type="submit"] {
  padding:10px 18px;
  background: var(--accent);
  color:white;
  border:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

table {
  width:100%;
  border-collapse: collapse;
}
th, td {
  border:1px solid #ddd;
  padding:10px;
}
th {
  background:#6c7ae0;
  color:white;
}
tr:nth-child(even) {
  background:#f8fbff;
}

#runsChart {
  max-width:900px;
  height:420px;
  margin:26px auto;
  background:#fff;
  border-radius:8px;
  padding:12px;
}
</style>
</head>

<body>

<div class="hero">
  <h1>RUNNING</h1>
</div>

<div class="tabs">
  <button id="tab-2025" onclick="setYear(2025)">2025</button>
  <button id="tab-2026" onclick="setYear(2026)">2026</button>
</div>

<div class="card">
<form id="runForm">
  <div class="field">
    <label>Date</label>
    <input id="date" type="date" required>
  </div>

  <div class="field">
    <label>Distance (miles)</label>
    <input id="distance" type="number" step="0.01" required>
  </div>

  <div class="field">
    <label>Time (mm:ss)</label>
    <input id="time" type="text" placeholder="14:54" required>
  </div>

  <div class="field" style="align-self:flex-end;">
    <button type="submit">Add Run</button>
  </div>
</form>
</div>

<table class="card">
<thead>
<tr>
  <th>Date</th>
  <th>Distance</th>
  <th>Time</th>
</tr>
</thead>
<tbody id="runsTable"></tbody>
</table>

<canvas id="runsChart"></canvas>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
const NETLIFY_FN = "https://mycology-bro.netlify.app/.netlify/functions/addRun";
const RAW_RUNS_JSON = "https://raw.githubusercontent.com/mycologybro/mycologybro/main/runs.json";

let runs = [];
let activeYear = new Date().getFullYear();
let chart = null;

function assertTimeFormat(t){
  return /^[0-9]{1,2}:[0-5][0-9]$/.test(t);
}

function normalizeTime(t){
  const [m,s] = t.split(":").map(Number);
  return `${m}:${String(Math.min(59,s)).padStart(2,"0")}`;
}

function timeToMinutes(t){
  const [m,s] = t.split(":").map(Number);
  return m + s/60;
}

function setYear(y){
  activeYear = y;
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));
  document.getElementById("tab-"+y)?.classList.add("active");
  render();
}

function render(){
  const filtered = runs.filter(r => new Date(r.date).getFullYear() === activeYear);
  renderTable(filtered);
  renderChart(filtered);
}

function renderTable(arr){
  const tbody = document.getElementById("runsTable");
  tbody.innerHTML = "";
  arr.forEach(r=>{
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${r.date}</td><td>${r.distance}</td><td>${r.time}</td>`;
    tbody.appendChild(tr);
  });
}

function renderChart(arr){
  if(chart) chart.destroy();
  if(arr.length === 0) return;

  const sorted = [...arr].sort((a,b)=>new Date(a.date)-new Date(b.date));
  const labels = sorted.map(r=>r.date);
  const data = sorted.map(r=>timeToMinutes(r.time)/r.distance);

  chart = new Chart(document.getElementById("runsChart"),{
    type:"line",
    data:{
      labels,
      datasets:[{
        label:"Pace (min/mile)",
        data,
        tension:0.25,
        pointRadius:4,
        segment:{ borderColor:c=>c.p0.parsed.y<10?"green":"red" },
        pointBackgroundColor:c=>c.parsed.y<10?"green":"red"
      }]
    },
    options:{
      scales:{
        y:{
          ticks:{
            callback:v=>{
              const m=Math.floor(v);
              const s=Math.round((v-m)*60);
              return `${m}:${String(s).padStart(2,"0")}`;
            }
          }
        }
      }
    }
  });
}

async function loadRuns(){
  try{
    const res = await fetch(RAW_RUNS_JSON,{cache:"no-store"});
    if(res.ok) runs = await res.json();
  }catch(e){
    console.error("Load failed",e);
    runs=[];
  }
  setYear(activeYear);
}

async function saveRun(run){
  await fetch(NETLIFY_FN,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify(run)
  });
}

document.getElementById("runForm").addEventListener("submit", async e=>{
  e.preventDefault();

  const date = document.getElementById("date").value;
  let distance = document.getElementById("distance").value;
  let time = document.getElementById("time").value.trim();

  if(!date || !distance || !time) return alert("Fill all fields");
  if(!assertTimeFormat(time)) return alert("Use mm:ss");

  time = normalizeTime(time);
  distance = Number(distance).toFixed(2);

  const run = { date, distance, time };
  runs.push(run);

  setYear(new Date(date).getFullYear());
  await saveRun(run);

  e.target.reset();
});

loadRuns();
</script>

</body>
</html>
