<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Run Tracker</title>

  <style>
    :root { --accent:#007acc; --bg:#f4f4f4; --card:#fff; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      margin: 0;
      padding: 20px;
      color: #111;
      text-align: center;
    }

    .hero {
      width: 100%;
      height: 160px;
      border-radius: 10px;
      overflow: hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      margin-bottom: 12px;
      background-image: url("images/running.png");
      background-size: cover;
      background-position: center;
      position: relative;
      box-shadow: 0 6px 18px rgba(0,0,0,0.12);
    }
    .hero::after {
      content: "";
      position:absolute; inset:0;
      background: rgba(0,0,0,0.28);
    }
    .hero h1 {
      position: relative;
      margin: 0;
      color: #fff;
      font-size: 36px;
      letter-spacing: 2px;
      z-index: 2;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.6);
    }

    /* tabs */
    .tabs {
      margin: 18px 0;
    }
    .tabs button {
      padding: 10px 20px;
      margin: 0 6px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      border-radius: 8px;
      border: 1px solid #ccc;
      background: #fff;
    }
    .tabs button.active {
      background: var(--accent);
      color: #fff;
    }

    nav {
      margin: 14px 0;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    nav a img { height:50px; }

    .card {
      max-width: 760px;
      margin: 14px auto;
      background: var(--card);
      padding: 14px;
      border-radius: 8px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.06);
      text-align: left;
    }

    form {
      display:flex;
      flex-wrap:wrap;
      gap:12px;
      align-items:center;
      justify-content:center;
    }
    form .field { display:flex; flex-direction:column; }

    input {
      padding:8px 10px;
      border-radius:6px;
      border:1px solid #ccc;
      font-size:14px;
      width:180px;
    }

    button[type="submit"] {
      padding:10px 18px;
      background: var(--accent);
      color:white;
      border:none;
      border-radius:8px;
      cursor:pointer;
      font-weight:700;
    }

    table {
      width:100%;
      border-collapse: collapse;
      margin-top: 18px;
      background: #fff;
    }
    th, td {
      padding:10px;
      border:1px solid #ddd;
      text-align:center;
    }
    th { background:#6c7ae0; color:#fff; }
    tr:nth-child(even) { background:#f8fbff; }

    #runsChart {
      max-width:900px;
      height:420px;
      margin:26px auto;
      background:#fff;
      border-radius:8px;
      padding:12px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.04);
    }
  </style>
</head>
<body>

  <div class="hero"><h1>RUNNING</h1></div>

  <nav>
    <a href="index.html"><img src="images/spawnjars.png"></a>
    <a href="tubs.html"><img src="images/tubs.png"></a>
    <a href="coin.html"><img src="images/coinbutton.JPEG"></a>
    <a href="runs.html"><img src="images/running.png"></a>
    <a href="agar.html"><img src="images/agar_header.png"></a>
    <a href="recipes.html"><img src="images/recipes.jpg"></a>
  </nav>

  <!-- YEAR TABS -->
  <div class="tabs">
    <button id="tab-2025" onclick="setYear(2025)">2025</button>
    <button id="tab-2026" onclick="setYear(2026)">2026</button>
  </div>

  <div class="card">
    <form id="runForm" autocomplete="off">
      <div class="field">
        <label>Date</label>
        <input id="date" type="date" required>
      </div>
      <div class="field">
        <label>Distance (miles)</label>
        <input id="distance" type="number" step="0.01" required>
      </div>
      <div class="field">
        <label>Time (mm:ss)</label>
        <input id="time" type="text" placeholder="14:54" required>
      </div>
      <div class="field" style="align-self:center;">
        <label style="visibility:hidden">submit</label>
        <button type="submit">Add Run</button>
      </div>
    </form>
  </div>

  <table id="runsTable" class="card" style="max-width:900px;">
    <thead>
      <tr><th>Date</th><th>Distance</th><th>Time</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <canvas id="runsChart"></canvas>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    const NETLIFY_FN="https://mycology-bro.netlify.app/.netlify/functions/addRun";
    const RAW_RUNS_JSON="https://raw.githubusercontent.com/mycologybro/mycologybro/main/runs.json";

    const tableBody=document.querySelector("#runsTable tbody");
    const ctx=document.getElementById("runsChart").getContext("2d");
    let chart=null;
    let runs=[];
    let activeYear=2025;

    function timeToMinutes(t){
      const [m,s]=t.split(":").map(Number);
      return m + s/60;
    }

    function filteredRuns(){
      return runs.filter(r=>new Date(r.date).getFullYear()===activeYear);
    }

    function render(){
      const arr=filteredRuns();
      tableBody.innerHTML="";
      arr.forEach(r=>{
        tableBody.innerHTML+=
          `<tr><td>${r.date}</td><td>${Number(r.distance).toFixed(2)}</td><td>${r.time}</td></tr>`;
      });

      const sorted=arr.slice().sort((a,b)=>new Date(a.date)-new Date(b.date));
      if(chart) chart.destroy();
      chart=new Chart(ctx,{
        type:"line",
        data:{
          labels:sorted.map(r=>r.date),
          datasets:[{
            label:`Pace ${activeYear}`,
            data:sorted.map(r=>timeToMinutes(r.time)/r.distance),
            tension:0.25,
            pointRadius:4,
            segment:{borderColor:c=>c.p0.parsed.y<10?"green":"red"},
            pointBackgroundColor:c=>c.parsed.y<10?"green":"red"
          }]
        }
      });
    }

    function setYear(y){
      activeYear=y;
      document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));
      document.getElementById("tab-"+y).classList.add("active");
      render();
    }

    async function loadRuns(){
      try{
        const r=await fetch(RAW_RUNS_JSON,{cache:"no-store"});
        runs=await r.json();
      }catch{ runs=[]; }
      setYear(2025);
    }

    document.getElementById("runForm").addEventListener("submit",async e=>{
      e.preventDefault();
      const run={
        date:date.value,
        distance:Number(distance.value).toFixed(2),
        time:time.value.trim()
      };
      runs.push(run);
      render();
      fetch(NETLIFY_FN,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify(run)
      });
      e.target.reset();
    });

    loadRuns();
  </script>
</body>
</html>
