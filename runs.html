<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Run Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
    }
    form {
      margin: 20px 0;
      text-align: center;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: #fff;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: center;
    }
    th {
      background: #6c7ae0;
      color: white;
    }
    tr:nth-child(even) {
      background: #f9f9f9;
    }
    canvas {
      margin-top: 30px;
      display: block;
      width: 100%;
      max-width: 700px;
      height: 400px;
    }
  </style>
</head>
<body>
 <header>
    <img src="images/running.png" alt="Running Tracker">
  </header>

  <form id="runForm">
    <input type="date" id="date" required>
    <input type="number" step="0.01" id="distance" placeholder="Distance (km)" required>
<input type="text" id="time" placeholder="Time (mm:ss)" pattern="^[0-9]{1,2}:[0-5][0-9]$" required>
    <button type="submit">Add Run</button>
  </form>

  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Distance (km)</th>
        <th>Time (MM:SS)</th>
      </tr>
    </thead>
    <tbody id="runTableBody"></tbody>
  </table>

  <canvas id="runChart"></canvas>

  <script>
    document.getElementById("runForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const date = document.getElementById("date").value;
  const distance = parseFloat(document.getElementById("distance").value);
  const time = document.getElementById("time").value;

  const res = await fetch("/.netlify/functions/addRun", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ date, distance, time }),
  });

  const data = await res.json();
  alert(data.message);
});

  </script>
</body>
</html>
