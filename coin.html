    canvas {

      background: #fff;

      box-shadow: 0 2px 6px rgba(0,0,0,0.15);

    <tbody>

    </tbody>

  <h2 style="text-align:center; margin-top:20px;">Coin Totals Over Time</h2>
  <canvas id="coinChart" width="800" height="400"></canvas>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    const rows = document.querySelectorAll("table tbody tr");
    let myValues = [];
    let dadValues = [];
    let labels = [];

    rows.forEach((row, index) => {
      const cells = row.querySelectorAll("td");
      if (cells.length === 2) {
        myValues.push(parseInt(cells[0].textContent.trim(), 10));
        dadValues.push(parseInt(cells[1].textContent.trim(), 10));
        labels.push("Entry " + (index + 1));
      }
    });

    const ctx = document.getElementById("coinChart").getContext("2d");
    new Chart(ctx, {
      type: "line",
      data: {
        labels: labels,
        datasets: [
          {
            label: "Mine",
            data: myValues,
            borderColor: "red",
            backgroundColor: "rgba(255,0,0,0.2)",
            tension: 0.3
          },
          {
            label: "Dad's",
            data: dadValues,
            borderColor: "blue",
            backgroundColor: "rgba(0,0,255,0.2)",
            tension: 0.3
          }
        ]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { position: "top" }
        },
        scales: {
          y: {
            beginAtZero: false
          }
        }
      }
    });
  </script>

</body>
